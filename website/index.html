<!DOCTYPE html>
<html lang="en">
  <head>
    <title>touchlineHQ — Custom Grassroots Football Websites</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Professional websites for grassroots football clubs with live fixtures, results, and team management. Powered by ELBantams & fulltimeCalendar." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/images/favicons/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicons/favicon-96x96.png">
    <link rel="shortcut icon" href="/images/favicons/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/images/favicons/site.webmanifest">
    <style>
      html {
        scroll-behavior: smooth;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in-up {
        animation: fadeInUp 0.6s ease-out;
      }
      /* Hide elements on mobile */
      @media (max-width: 576px) {
        .hidden-mobile {
          display: none !important;
        }
        .hero-btn-full {
          width: 100% !important;
        }
      }
      @media (min-width: 577px) {
        .hero-btn-full {
          width: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
