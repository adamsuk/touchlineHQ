name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path for GitHub Pages (override auto-detection)'
        required: false
        default: ''
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Allow only one concurrent deployment
concurrency:
  group: "github-pages-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-${{ github.head_ref || github.ref_name }}
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Determine base path
        id: base
        run: |
          if [ -n "${{ github.event.inputs.base_path }}" ]; then
            BASE_PATH="${{ github.event.inputs.base_path }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use branch name as sub-path for PR previews
            BRANCH_NAME="${{ github.head_ref }}"
            BASE_PATH="/${{ github.event.repository.name }}/preview/$BRANCH_NAME/"
            echo "PR preview detected, using base path: $BASE_PATH"
          else
            BASE_PATH="/${{ github.event.repository.name }}/"
            echo "Main deploy, using base path: $BASE_PATH"
          fi
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_OUTPUT"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: website
        
      - name: Build project
        run: npm run build
        working-directory: website
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.BASE_PATH }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const baseUrl = '${{ steps.deployment.outputs.page_url }}';
            const branchName = '${{ github.head_ref }}';
            const previewUrl = baseUrl;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployed
            
            | Detail | Value |
            |---|---|
            | Branch | \`${branchName}\` |
            | Preview URL | [${previewUrl}](${previewUrl}) |
            
            > Open this URL to see the changes live on your device (including mobile).`
            });